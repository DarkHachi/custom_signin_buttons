name: custom_signin_buttons
description: A package designed to create sign in buttons in an easier and more customizable way.
version: 1.1.0
repository: https://github.com/DarkHachi/custom_signin_buttons

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/google.png
    - assets/playstore.png
    - assets/tiktok.png